name: Build and Release OTEL Extension

on:
  release:
    types: [created]

permissions:
  # contents: write is needed to attach extension.tar.gz to the release.
  # packages: write was only for the duplicate argocd-otel-extension-api image,
  # which this workflow no longer builds -- the real backend lives in
  # GlueOps/argo-cd-extention-backend and publishes argocd-extension-backend-api.
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          cd extensions/otel
          npm ci
          npm run build
      - run: |
          mkdir -p resources/otel-extension
          cp extensions/otel/dist/extensions.js resources/otel-extension/extensions.js
          tar -czf extension.tar.gz resources/
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: extension.tar.gz
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
